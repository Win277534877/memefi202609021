name: Build MemCheck EFI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU‑EFI
        run: |
          sudo apt update
          sudo apt install -y gnu-efi make gcc binutils
      - name: Compile
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memcheck-efi
          path: memcheck.efi
