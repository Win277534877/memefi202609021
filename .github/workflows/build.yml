name: Build MemCheck EFI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/tianocore/containers:edk2-build-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare EDK2 App
        run: |
          mkdir -p MemCheckApp
          cp memcheck.c MemCheckApp/MemCheckApp.c
cat > MemCheckApp/MemCheckApp.inf <<'EOF'
[Defines]
  INF_VERSION                    = 0x00010005
  BASE_NAME                      = MemCheckApp
  FILE_GUID                      = 69E952B8-2775-4877-5348-877534877300
  MODULE_TYPE                    = UEFI_APPLICATION
  VERSION_STRING                 = 1.0
  ENTRY_POINT                    = UefiMain

[Sources]
  MemCheckApp.c

[Packages]
  MdePkg/MdePkg.dec

[LibraryClasses]
  UefiApplicationEntryPoint
  UefiLib
  BaseLib
  BaseMemoryLib
  UefiBootServicesTableLib
  PrintLib
EOF

cat > target.txt <<'EOF'
ACTIVE_PLATFORM       = MdePkg/MdePkg.dsc
TARGET                = RELEASE
TARGET_ARCH           = X64
TOOL_CHAIN_TAG        = GCC
EOF

      - name: EDK2 Build
        run: |
          source /edk2/edksetup.sh
          build -n $(nproc) -p MemCheckApp/MemCheckApp.inf

      - name: Export efi
        run: cp ./Build/MdePkg/RELEASE_GCC/X64/MemCheckApp.efi ./memcheck.efi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memcheck‑efi
          path: memcheck.efi
